name: Native release packages
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref }}
      - run: sudo apt-get update && sudo apt-get install -y build-essential python3 ghostscript cups libcups2-dev libjbig-dev
      - run: python3 tools/build_native.py deb
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ubuntu24.04-deb
          path: dist/*.deb
  rpm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref }}
      - run: docker run --rm -v "$PWD:/src" -w /src fedora:44 bash -c 'dnf install -y gcc make python3 ghostscript cups cups-devel jbigkit-devel rpm-build && useradd -u 1001 -m builder && chown -R builder:builder /src && runuser -u builder -- python3 tools/build_native.py rpm'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fedora44-rpm
          path: dist/*.rpm
