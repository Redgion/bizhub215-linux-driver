name: Publish reviewed release
on:
  workflow_dispatch:
    inputs:
      source_tree:
        description: Reviewed Git tree SHA (complete public allowlist)
        required: true
      base_commit:
        description: Previous reviewed main commit SHA
        required: true
permissions:
  contents: write
concurrency:
  group: publish-reviewed-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Materialize reviewed tree with non-personal commit identity
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TREE: ${{ inputs.source_tree }}
          BASE_COMMIT: ${{ inputs.base_commit }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, re, subprocess, tempfile
          def git(*args, **kw):
              return subprocess.check_output(['git', *args], **kw).decode().strip()
          tree, base = os.environ['SOURCE_TREE'], os.environ['BASE_COMMIT']
          if not all(re.fullmatch(r'[0-9a-f]{40}', value) for value in (tree, base)):
              raise SystemExit('Expected exact tree/commit SHA')
          head = git('rev-parse', 'HEAD')
          subprocess.run(['git', 'merge-base', '--is-ancestor', base, head], check=True)
          # A one-time web bootstrap may add only this exact workflow; do not
          # discard any unrelated repository changes or concurrent updates.
          changed = git('diff', '--name-only', base, head).splitlines()
          workflow_paths = {'.github/workflows/' + name for name in ('publish.yml', 'test.yml', 'packages.yml')}
          if any(path not in workflow_paths for path in changed):
              raise SystemExit('Main changed since the reviewed base')
          repo = os.environ['GITHUB_REPOSITORY']
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/{path}']))
          listing = api(f'git/trees/{tree}?recursive=1')
          if listing.get('truncated') or len(listing['tree']) > 300:
              raise SystemExit('Unexpected source tree size')
          index = pathlib.Path(tempfile.mkdtemp()) / 'index'
          env = dict(os.environ, GIT_INDEX_FILE=str(index))
          subprocess.run(['git', 'read-tree', '--empty'], env=env, check=True)
          total = 0
          for entry in listing['tree']:
              if entry['type'] == 'tree':
                  continue
              path = pathlib.PurePosixPath(entry['path'])
              if (entry['type'] != 'blob' or entry['mode'] not in ('100644', '100755') or
                  path.is_absolute() or '..' in path.parts or '.git' in path.parts):
                  raise SystemExit('Unsafe source tree entry')
              blob = api('git/blobs/' + entry['sha'])
              if blob['encoding'] != 'base64' or blob['size'] > 1024 * 1024:
                  raise SystemExit('Unexpected source blob')
              data = base64.b64decode(blob['content'], validate=False)
              total += len(data)
              if total > 8 * 1024 * 1024:
                  raise SystemExit('Source tree too large')
              sha = git('hash-object', '-w', '--stdin', input=data)
              if sha != entry['sha']:
                  raise SystemExit('Blob hash mismatch')
              subprocess.run(['git', 'update-index', '--add', '--cacheinfo', entry['mode'], sha, str(path)], env=env, check=True)
          if git('write-tree', env=env) != tree:
              raise SystemExit('Tree hash mismatch')
          identity = dict(os.environ, GIT_AUTHOR_NAME='Project contributors',
                          GIT_COMMITTER_NAME='Project contributors',
                          GIT_AUTHOR_EMAIL='noreply@github.com', GIT_COMMITTER_EMAIL='noreply@github.com')
          commit = git('commit-tree', tree, '-p', base, '-m', 'Release native network scanning and security checks', env=identity)
          subprocess.run(['git', 'checkout', '--detach', commit], check=True)
          version = pathlib.Path('VERSION').read_text().strip()
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version):
              raise SystemExit('Invalid release version')
          for path in workflow_paths:
              if git('rev-parse', 'HEAD:' + path) != git('rev-parse', head + ':' + path):
                  raise SystemExit('Workflow files must match the reviewed web bootstrap')
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write(f'RELEASE_COMMIT={commit}\nEXPECTED_MAIN={head}\nRELEASE_VERSION={version}\n')
          PY
      - name: Install build dependencies from distribution repositories
        run: |
          sudo sed -i 's@http://azure.archive.ubuntu.com/ubuntu@https://archive.ubuntu.com/ubuntu@g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential python3 ghostscript cups libcups2-dev libjbig-dev patch pkg-config sane-utils rpm rpm2cpio
      - name: Validate source and build scanner without root
        run: |
          python3 tools/check_public.py
          python3 tools/build_scanner.py --build > /tmp/scanner-build.log 2>&1 || { tail -n 80 /tmp/scanner-build.log; exit 1; }
          KM215_SCANNER_LIBRARY="$PWD/build/scanner/compile/backend/.libs/libsane-magicolor.so.1.4.0" make test
          cupstestppd -W filters cups/KonicaMinolta-bizhub215-custom.ppd
      - name: Build source and native packages
        run: |
          python3 tools/build_release.py
          python3 tools/build_native.py deb
          docker run --rm -v "$PWD:/src" -w /src fedora:44 bash -c 'dnf install -y gcc make python3 ghostscript cups cups-devel jbigkit-devel rpm-build && useradd -u 1001 -m builder && chown -R builder:builder /src && runuser -u builder -- python3 tools/build_native.py rpm'
          python3 tools/verify_release.py --write-checksums
      - name: Publish checked commit, tag and release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="v$RELEASE_VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag"; then
            echo "Release tag already exists" >&2
            exit 1
          fi
          git push --force-with-lease="refs/heads/main:$EXPECTED_MAIN" origin "$RELEASE_COMMIT:refs/heads/main"
          git tag "$tag" "$RELEASE_COMMIT"
          git push origin "refs/tags/$tag"
          gh release create "$tag" --verify-tag --title "$tag — printing and native network scanning" --notes-file docs/RELEASE.md dist/*"$RELEASE_VERSION"*.tar.gz dist/*"$RELEASE_VERSION"*.zip dist/*"$RELEASE_VERSION"*.rpm dist/*"$RELEASE_VERSION"*.deb dist/SHA256SUMS
