name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: sudo apt-get update && sudo apt-get install -y build-essential python3 ghostscript cups libcups2-dev libjbig-dev
      - run: make test
      - run: cupstestppd -W filters cups/KonicaMinolta-bizhub215-custom.ppd
      - run: python3 tools/build_release.py
  fedora:
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - run: dnf install -y git gcc make python3 ghostscript cups cups-devel jbigkit-devel
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: make test
      - run: cupstestppd -W filters cups/KonicaMinolta-bizhub215-custom.ppd
